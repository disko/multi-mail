[project]
name = "multi-mail-dev"
version = "0.3.1"
description = "Dev-time tooling for the multi-mail MCP plugin (runtime uses PEP 723 inline deps)"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "defusedxml>=0.7.1",
    "pydantic>=2.0",
    "mcp>=1.0",
    "caldav>=1.3",
    "vobject>=0.9.7",
    "managesieve>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
