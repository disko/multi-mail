[project]
name = "multi-mail-dev"
version = "0.4.0"
description = "Dev-time tooling for the multi-mail MCP plugin (runtime uses PEP 723 inline deps)"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "defusedxml>=0.7.1",
    "pydantic>=2.0",
    "mcp>=1.0",
    "caldav>=1.3",
    "vobject>=0.9.7",
    "managesieve>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["servers"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
